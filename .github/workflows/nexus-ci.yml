name: Nexus CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install backend
        run: python -m pip install -e 'backend[dev,media,agents,tools]'
      - name: Install frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Verify contracts, migration, backend, and frontend
        env:
          PYTHON: python
          RUFF: ruff
          ALEMBIC: alembic
        run: ./scripts/verify-nexus.sh
