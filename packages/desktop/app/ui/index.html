<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' file:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Tessmora</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="arrow" viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"/></symbol>
    <symbol id="external" viewBox="0 0 24 24"><path d="M13 5h6v6m0-6L9 15m-1-9H5v13h13v-3"/></symbol>
    <symbol id="folder" viewBox="0 0 24 24"><path d="M3 8V6a1 1 0 0 1 1-1h5l2 3h9a1 1 0 0 1 1 1v2M3 10h18l-2 9H4z"/></symbol>
    <symbol id="server" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/><path d="M7 7h.1M7 17h.1m9-10h2m-2 10h2"/></symbol>
    <symbol id="globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></symbol>
    <symbol id="exit" viewBox="0 0 24 24"><path d="M11 4H5v16h6m-1-8h11m-5-5 5 5-5 5"/></symbol>
    <symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  </svg>
  <header class="titlebar">
    <div class="brand"><img id="app-mark" width="30" height="30" alt=""><span>Tessmora</span></div>
    <button type="button" id="language" class="quiet"><svg aria-hidden="true"><use href="#globe"/></svg><span id="language-label">English</span></button>
  </header>
  <main>
    <section class="hero" aria-labelledby="library-title" aria-describedby="service-description">
      <div class="hero-art" aria-hidden="true"><i></i><img id="library-art" alt=""></div>
      <div class="hero-copy">
        <div class="service-meta"><span class="signal" id="signal" data-state="checking"></span><span id="service-state" role="status"></span><span class="meta-divider"></span><span class="address">localhost:3001</span></div>
        <h1 id="library-title" data-i18n="title">本机资料库</h1>
        <p id="service-description"></p>
        <div class="hero-actions">
          <button id="open-service" class="hero-primary" type="button" disabled><span id="service-action"></span><svg aria-hidden="true"><use href="#arrow"/></svg></button>
          <button id="open-browser" class="hero-secondary" type="button" hidden><span data-i18n="openBrowser">在浏览器打开</span><svg aria-hidden="true"><use href="#external"/></svg></button>
        </div>
      </div>
    </section>
    <p id="home-status" class="status" role="status"></p>
    <p id="home-error" class="error" role="alert" hidden></p>
    <section id="recent" class="recent" aria-labelledby="recent-title" hidden>
      <h2 id="recent-title" data-i18n="workspaces">已保存的工作区</h2>
      <div id="workspace-list" class="workspace-list"></div>
    </section>
    <section class="choices" aria-labelledby="choices-title">
      <h2 id="choices-title" data-i18n="otherWays">其他打开方式</h2>
      <div class="choice-grid">
        <button id="local-tab" class="choice" type="button" aria-haspopup="dialog"><span class="choice-icon lilac"><svg aria-hidden="true"><use href="#folder"/></svg></span><span class="choice-copy"><strong data-i18n="local">本地文件夹</strong><small data-i18n="localSummary">创建或打开独立的桌面工作区，无需账号。</small></span><svg class="go" aria-hidden="true"><use href="#arrow"/></svg></button>
        <button id="remote-tab" class="choice" type="button" aria-haspopup="dialog"><span class="choice-icon mint"><svg aria-hidden="true"><use href="#server"/></svg></span><span class="choice-copy"><strong data-i18n="remote">连接服务器</strong><small data-i18n="remoteSummary">用服务地址和访问凭证打开远程资料库。</small></span><svg class="go" aria-hidden="true"><use href="#arrow"/></svg></button>
      </div>
    </section>
  </main>
  <footer><span data-i18n="historyHint">要继续浏览器里的旧对话，请用原浏览器打开。</span><button id="quit" class="quiet" type="button"><svg aria-hidden="true"><use href="#exit"/></svg><span data-i18n="quit">退出 Tessmora</span></button></footer>
  <dialog id="workspace-dialog" aria-labelledby="connect-title" aria-describedby="form-hint">
    <div class="dialog-heading"><h2 id="connect-title"></h2><button id="cancel-form" class="close-button" type="button" autofocus><svg aria-hidden="true"><use href="#close"/></svg></button></div>
    <p id="form-hint"></p>
    <form id="workspace-form">
      <label for="name" data-i18n="name">工作区名称</label><input id="name" name="name" required maxlength="80" autocomplete="off">
      <div id="local-fields"><label id="directory-heading" data-i18n="directory">资料目录</label><button id="choose-directory" class="directory-picker" aria-labelledby="directory-heading directory-label" type="button"><svg aria-hidden="true"><use href="#folder"/></svg><span id="directory-label" data-i18n="chooseDirectory">选择文件夹</span></button></div>
      <div id="remote-fields" hidden><label for="url" data-i18n="address">服务地址</label><input id="url" name="url" type="url" placeholder="https://tessmora.example.com" autocomplete="url" spellcheck="false"></div>
      <div id="credential-fields" hidden><label for="token" data-i18n="credential">访问凭证</label><input id="token" name="token" type="password" autocomplete="off" aria-describedby="credential-hint"><small id="credential-hint" data-i18n="credentialHint">由服务管理员提供，用于访问此实例。</small><label class="checkbox"><input id="remember" type="checkbox"><span data-i18n="remember">使用系统凭证库记住此连接</span></label><small id="keychain-note" hidden data-i18n="keychainUnavailable">系统凭证库不可用，凭证仅在本次会话有效。</small></div>
      <p id="status" class="status" role="status"></p><p id="error" class="error" role="alert" hidden></p>
      <button id="submit" class="primary" type="submit"></button>
    </form>
  </dialog>
  <script src="./launcher.js"></script>
</body>
</html>
